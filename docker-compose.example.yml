services:
  ws4kp:
    build:
      context: .
      dockerfile: Dockerfile
    image: ws4kp-server:local
    container_name: ws4kp
    environment:
      # These defaults reach Prometheus and Loki running on the Docker host.
      # Override PROMETHEUS_URL or LOKI_URL for remote endpoints or services
      # attached to the same Compose network.
      WS4KP_PROMETHEUS_URL: ${PROMETHEUS_URL:-http://host.docker.internal:9090}
      WS4KP_LOKI_URL: ${LOKI_URL:-http://host.docker.internal:3100}
    extra_hosts:
      # Makes host.docker.internal available on Linux as well as Docker Desktop.
      - host.docker.internal:host-gateway
    ports:
      - "${WS4KP_PORT:-8080}:8080"
    restart: unless-stopped
